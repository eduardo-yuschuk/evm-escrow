# End-to-end smoke test: the whole stack from a clean runner, and the demo against it. The demo exits
# with 1 if the API does not report the expected state at any step.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main keeps its result; a pull request only needs the latest one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack
        run: |
          docker compose version
          docker compose up -d --build --wait

      - name: Demo
        run: docker compose run --rm demo

      - name: Logs of the stack
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down -v
