[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The deploy script writes the contract address and start block for the indexer.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 50
fail_on_revert = false

# FOUNDRY_PROFILE=ci: more fuzz and invariant runs.
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 100
fail_on_revert = false

[fmt]
line_length = 120

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.7.0"
