# Debug override for the local stack: the API runs from ./api/src with tsx and the Node inspector open,
# for VS Code to attach (.vscode/launch.json, "Attach to API").
# Usage: docker compose -f docker-compose.yml -f docker-compose.debug.yml up --build

services:
  api:
    build:
      target: dev
    image: evm-escrow/api:dev
    # Starts as root; the entrypoint drops to the owner of ./api.
    user: root
    entrypoint: [api-entrypoint]
    command: [node, --inspect=0.0.0.0:9229, --import, tsx, src/index.ts]
    volumes:
      - ./api:/app
    ports:
      # The inspector runs arbitrary code: published on 127.0.0.1 only, like the other ports.
      - 127.0.0.1:${API_DEBUG_PORT:-9229}:9229
