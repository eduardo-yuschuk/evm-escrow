name: evm-escrow-sepolia

# The Escrow on Sepolia, deployed with short windows so that an escrow expires during the demo. A
# separate compose project from the local stack: no Anvil, no deployer, its own database and port.
#
#   docker compose -f docker-compose.sepolia.yml up --build      indexes the deployed contract
#   docker compose -f docker-compose.sepolia.yml run --rm deploy deploys and verifies (.env.sepolia)
#   docker compose -f docker-compose.sepolia.yml run --rm demo   runs the demo (.env.sepolia)
#
# The deployment is contracts/deployments/11155111.json, committed, so indexing needs no keys. The
# keys of deploy and demo go in .env.sepolia (see .env.sepolia.example), and the overrides in .env.

# A public endpoint by default, so that indexing needs no account anywhere.
x-rpc-url: &rpc-url ${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}

services:
  # Not published: docker compose -f docker-compose.sepolia.yml exec postgres psql -U escrow escrow
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: escrow
      POSTGRES_DB: escrow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: while the init scripts run, Postgres only listens on its Unix socket.
      test: [CMD, pg_isready, --host, 127.0.0.1, --username, escrow, --dbname, escrow]
      interval: 1s
      timeout: 5s
      retries: 30

  # Indexer and HTTP API in one process, against Sepolia.
  api:
    build:
      context: ./api
      target: runtime
    image: evm-escrow/api:runtime
    environment:
      RPC_URL: *rpc-url
      DATABASE_URL: postgres://escrow:escrow@postgres:5432/escrow
      DEPLOYMENTS_FILE: /deployments/11155111.json
      # Reorgs on Sepolia are shallow: about 12 blocks (2.4 minutes) is the usual margin.
      CONFIRMATIONS: ${SEPOLIA_CONFIRMATIONS:-12}
      # Fewer eth_getLogs calls to catch up from the deployment block. The public endpoint accepts
      # 10,000 blocks per call; lower it for a provider with a smaller limit.
      BATCH_SIZE: ${SEPOLIA_BATCH_SIZE:-10000}
      # Sepolia does not restart: another chain or contract in the database is an error, not a reset.
      RESET_ON_CHAIN_MISMATCH: "false"
      LOG_LEVEL: ${LOG_LEVEL:-}
    volumes:
      - ./contracts/deployments:/deployments:ro
    ports:
      - 127.0.0.1:${SEPOLIA_API_PORT:-3001}:3000
    healthcheck:
      # The runtime image has no curl: Node's fetch. /health answers 503 while the indexer lags.
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 3
      # The first start indexes every block since the deployment.
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot ("deploy" profile): deploys the Escrow and a test token with short windows, verifies
  # them on Etherscan if ETHERSCAN_API_KEY is set, and writes contracts/deployments/11155111.json.
  # Like the local deployer, it skips the deployment when that file already describes the chain:
  # delete the file to deploy again.
  deploy:
    profiles: [deploy]
    build:
      context: ./contracts
      target: deps
    image: evm-escrow/contracts:deps
    # Starts as root; the entrypoint drops to the owner of ./contracts.
    user: root
    # script/deploy.sh reads the key from PRIVATE_KEY: the demo's sender deploys.
    command:
      - sh
      - -c
      - 'PRIVATE_KEY="$${SENDER_PRIVATE_KEY:?set it in .env.sepolia}" exec script/deploy.sh'
    env_file: .env.sepolia
    environment:
      RPC_URL: *rpc-url
      # Seconds. The cancel window has to outlast the API's lag (CONFIRMATIONS blocks), or the API
      # would never show a new escrow as cancellable.
      ESCROW_CANCEL_WINDOW: ${SEPOLIA_CANCEL_WINDOW:-300}
      ESCROW_TTL: ${SEPOLIA_TTL:-600}
      DEPLOY_MOCK_TOKEN: "true"
    volumes:
      - ./contracts:/app

  # The end-to-end demo against Sepolia ("demo" profile): it waits for the confirmations and for the
  # expiry in real time, so it takes about half an hour.
  demo:
    profiles: [demo]
    build:
      context: ./api
      target: dev
    image: evm-escrow/api:dev
    # Rebuilt on every run, so it runs the current script without mounting ./api.
    pull_policy: build
    command: [npm, run, --silent, demo]
    env_file: .env.sepolia
    environment:
      RPC_URL: *rpc-url
      API_URL: http://api:3000
      DEPLOYMENTS_FILE: /deployments/11155111.json
      CONFIRMATIONS: ${SEPOLIA_CONFIRMATIONS:-12}
      # Only printed, for curl from the host.
      HOST_API_URL: http://localhost:${SEPOLIA_API_PORT:-3001}
    volumes:
      - ./contracts/deployments:/deployments:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
